<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Now</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #5b35e7;
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #5b35e7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #error {
      color: #d93025;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Make Payment</h1>

    <div class="sub">
      Enter your details to continue
    </div>

    <label for="telegramUsername">
      Telegram Username
    </label>

    <input
      id="telegramUsername"
      type="text"
      placeholder="@username"
      autocomplete="off"
    >

    <label for="mobile">
      Mobile Number
    </label>

    <input
      id="mobile"
      type="tel"
      placeholder="Enter mobile number"
      maxlength="15"
      autocomplete="tel"
    >

    <label for="amount">
      Amount
    </label>

    <input
      id="amount"
      type="number"
      min="1"
      step="0.01"
      placeholder="Enter amount"
    >

    <button id="payBtn">
      Pay Now
    </button>

    <div id="error"></div>

  </div>

<script>

  const payBtn = document.getElementById("payBtn");
  const telegramInput =
    document.getElementById("telegramUsername");
  const mobileInput =
    document.getElementById("mobile");
  const amountInput =
    document.getElementById("amount");
  const errorDiv =
    document.getElementById("error");


  payBtn.addEventListener("click", async () => {

    errorDiv.textContent = "";


    const telegramUsername =
      telegramInput.value.trim();

    const mobile =
      mobileInput.value.trim();

    const amount =
      Number(amountInput.value);


    // Telegram username validation
    if (!telegramUsername) {
      errorDiv.textContent =
        "Please enter Telegram username";
      return;
    }


    // Mobile validation
    if (!mobile) {
      errorDiv.textContent =
        "Please enter mobile number";
      return;
    }


    // Amount validation
    if (!amount || amount <= 0) {
      errorDiv.textContent =
        "Please enter a valid amount";
      return;
    }


    payBtn.disabled = true;
    payBtn.textContent = "Processing...";


    try {

      const res = await fetch(
        "/api/create-payment",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            telegram_username:
              telegramUsername,

            mobile:
              mobile,

            amount:
              amount.toFixed(2)
          })
        }
      );


      const data = await res.json();


      if (!res.ok || !data.success) {

        errorDiv.textContent =
          data.message ||
          "Payment creation failed";

        payBtn.disabled = false;
        payBtn.textContent = "Pay Now";

        return;
      }if (!data.payment_url) {

        errorDiv.textContent =
          "Payment URL not received";

        payBtn.disabled = false;
        payBtn.textContent = "Pay Now";

        return;
      }


      // Open WatchPays payment page
      window.location.href =
        data.payment_url;


    } catch (err) {

      console.error(err);

      errorDiv.textContent =
        "Server error, please try again";

      payBtn.disabled = false;
      payBtn.textContent = "Pay Now";
    }

  });

</script>

</body>
</html>
