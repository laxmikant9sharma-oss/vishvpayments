<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    text-align: center;
  }
  h2 {
    margin-top: 0;
    color: #1f2937;
    font-size: 22px;
  }
  .field {
    text-align: left;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #6366f1;
  }
  button {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #4f46e5; }
  #qrBox {
    margin-top: 22px;
    display: none;
  }
  #qrcode {
    display: flex;
    justify-content: center;
    margin: 14px 0;
  }
  #qrcode img, #qrcode canvas {
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    padding: 8px;
  }
  .amtShow {
    font-size: 20px;
    font-weight: 700;
    color: #1f2937;
  }
  .note {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 8px;
  }
  .error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h2>💳 Payment Link Generator</h2>

  <div class="field">
    <label for="amount">Enter Amount (₹)</label>
    <input type="number" id="amount" placeholder="Enter Amount" min="1">
  </div>

  <div class="error" id="errMsg">Kripya sahi Amount daalein.</div>

  <button onclick="generateQR()">Payment Link / QR Banayein</button>

  <div id="qrBox">
    <div class="amtShow">₹ <span id="amtText"></span></div>
    <div id="qrcode"></div>
    <div class="note">Is QR ko kisi bhi UPI app (GPay, PhonePe, Paytm) se scan karke payment kar sakte hain.</div>
    <div class="note" id="linkText" style="word-break: break-all; margin-top:10px;"></div>
  </div>
</div>

<script>
// Apna UPI ID aur naam yahan set karein
const UPI_ID = "example@upi";
const PAYEE_NAME = "Merchant";

function generateQR() {
  const upiId = UPI_ID;
  const payeeName = PAYEE_NAME;
  const amount = document.getElementById('amount').value.trim();
  const errMsg = document.getElementById('errMsg');

  if (!amount || Number(amount) <= 0) {
    errMsg.style.display = 'block';
    document.getElementById('qrBox').style.display = 'none';
    return;
  }
  errMsg.style.display = 'none';

  // UPI deep link format
  const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount)}&cu=INR`;

  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: upiLink,
    width: 200,
    height: 200,
    colorDark: "#1f2937",
    colorLight: "#ffffff"
  });

  document.getElementById('amtText').innerText = Number(amount).toLocaleString('en-IN');
  document.getElementById('linkText').innerText = upiLink;
  document.getElementById('qrBox').style.display = 'block';
}
</script>

</body>
</html>
